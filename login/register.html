<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Đăng ký tài khoản - EventHub</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net"></script>
</head>
<body>
    <div class="card">
        <h2>Đăng ký</h2>
        <p>Tham gia cộng đồng EventHub ngay hôm nay</p>
        <input type="text" id="reg_name" placeholder="Họ và Tên">
        <input type="email" id="reg_email" placeholder="Email">
        <input type="text" id="reg_phone" placeholder="Số điện thoại">
        <div class="otp-group">
            <input type="text" id="otp_input" placeholder="Nhập mã 6 số">
            <button type="button" class="btn-otp" onclick="handleSendOTP()">Gửi mã</button>
        </div>
        <input type="password" id="reg_pass" placeholder="Mật khẩu">
        <button class="btn-main" onclick="handleRegister()">Tạo tài khoản</button>
        <div class="divider">Hoặc đăng ký bằng</div>
        <div class="social-group">
            <a href="https://accounts.google.com" target="_blank" class="btn-social">
                <img src="app/google.png" alt="Google">
                <span>Google</span>
            </a>
            <a href="https://www.facebook.com" target="_blank" class="btn-social">
                <img src="app/facebook.png" alt="Facebook">
                <span>Facebook</span>
            </a>
            <a href="https://www.tiktok.com" target="_blank" class="btn-social">
                <img src="app/tiktok.png" alt="TikTok">
                <span>TikTok</span>
            </a>
        </div>
        <div class="link-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
    </div>
    <script>
        // Biến toàn cục để lưu trữ mã OTP phục vụ kiểm tra logic
        let generatedOTP = null;
        /**
         * 1. Hàm Xử lý Gửi OTP
         * Tạo mã ngẫu nhiên và thông báo cho người dùng (Giả lập)
         */
        function handleSendOTP() {
            const email = document.getElementById('reg_email').value;
            // Kiểm tra tính hợp lệ cơ bản của email trước khi gửi mã
            if (!email || !email.includes('@')) {
                alert("⚠ Bạn chưa nhập đúng Email!");
                return;
            }
            // Tạo mã OTP ngẫu nhiên 6 chữ số
            generatedOTP = Math.floor(100000 + Math.random() * 900000);
            // Hiển thị mã (Trong thực tế sẽ gửi qua Email hoặc SMS)
            alert("MÃ OTP CỦA BẠN LÀ: " + generatedOTP);
            console.log("Hệ thống đã tạo mã:", generatedOTP);
        }
        /**
         * 2. Hàm Xử lý Đăng ký
         * Kiểm tra dữ liệu đầu vào và lưu trữ thông tin vào LocalStorage
         */
        function handleRegister() {
            // Thu thập dữ liệu từ các ô nhập liệu
            const name = document.getElementById('reg_name').value.trim();
            const email = document.getElementById('reg_email').value.trim();
            const phone = document.getElementById('reg_phone').value.trim();
            const pass = document.getElementById('reg_pass').value;
            const otpInput = document.getElementById('otp_input').value.trim();
            // Bước 1: Kiểm tra xem người dùng đã nhập đủ thông tin chưa
            if (!name || !email || !phone || !pass) {
                return alert("⚠ Vui lòng điền đầy đủ thông tin cá nhân!");
            }
            // Bước 2: Xác thực mã OTP
            if (!generatedOTP) {
                return alert("⚠ Vui lòng yêu cầu gửi mã OTP trước!");
            }
            if (otpInput != generatedOTP) {
                return alert("⚠ Mã OTP không chính xác. Vui lòng thử lại!");
            }
            // Bước 3: Lưu trữ dữ liệu vào trình duyệt (LocalStorage)
            // Dữ liệu này sẽ được trang login.html sử dụng để đối soát khi đăng nhập
            localStorage.setItem('storedName', name);
            localStorage.setItem('storedEmail', email);
            localStorage.setItem('storedPhone', phone);
            localStorage.setItem('storedPass', pass);
            // Bước 4: Thông báo và chuyển hướng
            alert("✅ Đăng ký thành công!");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
